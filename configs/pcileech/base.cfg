# PCILeech Base Configuration Template
# Copy this file and modify for your setup

# Device type: FPGA, USB3380, SP605, SQUIRREL
-device FPGA

# FPGA algorithm (1=default, 2=alternative)
-device fpga://algo=1

# Minimum FPGA firmware version
-min-fpga-version 9

# Memory read/write settings
-max-size 0x1000

# Output verbosity (1-3)
-verbosity 1

# Target OS (auto-detect if not set)
# -os windows
# -os linux

# Signature file for memory search
# -sig sigs/tx64_win11_24h2.sig

# KMD (Kernel Module) loader
# -kmd 0xffffffff

# Remote LeechCore connection (if using remote setup)
# -remote leechcore://ip=192.168.1.100

# Notes:
# - Make sure your FPGA firmware matches the algo setting
# - Use -verbosity 3 for debugging connection issues
# - Check guides/hardware-guide.md for board-specific settings
