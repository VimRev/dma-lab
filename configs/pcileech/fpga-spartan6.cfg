# PCILeech Config - Xilinx Spartan-6 FPGA Boards
# Optimized for: PCIeScreamer R2, older Spartan-6 designs

-device FPGA
-device fpga://algo=1
-min-fpga-version 7
-max-size 0x800
-verbosity 1

# Spartan-6 has lower throughput than Artix-7
# Keep max-size conservative for stability

# Common Spartan-6 firmware versions:
# v7  - Standard release
# v8  - Improved compatibility

# Notes for Spartan-6 users:
# - Budget option, may have slower DMA speeds
# - Some newer anti-cheat detections target Spartan-6 signatures
# - Consider upgrading to Artix-7 for better performance

# Signature file (uncomment for your target)
# -sig sigs/tx64_win11_24h2.sig
