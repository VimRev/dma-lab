# PCILeech Config - Xilinx Artix-7 FPGA Boards
# Optimized for: Screamer Squirrel, Enigma X1, custom Artix-7 designs

-device FPGA
-device fpga://algo=1
-min-fpga-version 9
-max-size 0x1000
-verbosity 1

# Artix-7 specific optimizations
# These boards support higher throughput — adjust if needed
# -max-size 0x2000  # Uncomment for faster reads (may cause issues on some boards)

# Common Artix-7 firmware versions:
# v9  - Standard release
# v10 - Enhanced DMA speed
# v11+ - Check your firmware provider

# Signature file (uncomment and set for your target OS)
# -sig sigs/tx64_win11_24h2.sig
# -sig sigs/tx64_win10_22h2.sig

# Notes for Artix-7 users:
# - Ensure FPGA is properly seated in PCIe slot
# - Check Device Manager for correct enumeration
# - If connection fails, try: -device fpga://algo=2
