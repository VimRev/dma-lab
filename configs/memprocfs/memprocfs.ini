; MemProcFS Configuration
; Memory Process File System - Forensic Analysis Mode

[main]
; Device configuration
device = FPGA
; device = FPGA://algo=1

; Mount point (Windows drive letter or Linux path)
; mount = M:
; mount = /mnt/memprocfs

; Forensic mode - read-only memory access
forensic = 1

; Verbosity level (0=quiet, 1=normal, 2=verbose, 3=debug)
verbosity = 1

[forensic]
; Forensic mode settings
; Enable process enumeration
process = 1

; Enable file extraction
files = 1

; Enable network connection listing
network = 1

; Enable registry hive extraction
registry = 1

[performance]
; Memory read buffer size
; Increase for faster bulk reads (requires compatible firmware)
; buffersize = 0x2000
buffersize = 0x1000

; Number of concurrent read threads
; threads = 4

; Notes:
; - Forensic mode is read-only and safe for analysis
; - Use for memory forensics, malware analysis, and debugging
; - Combine with Volatility for deeper analysis
; - Join our Discord for usage guides: https://discord.gg/JJgc2cDEK5
