# LeechCore Connection Configuration
# Used when connecting to a remote DMA device via LeechCore

# Local FPGA connection (default)
# No additional config needed for local setups

# Remote connection via LeechCore server
# -remote leechcore://ip=192.168.1.100

# TCP connection
# -remote leechcore://ip=192.168.1.100:28473

# USB3380 connection
# -device USB3380

# Notes:
# - Remote LeechCore requires leechcore-listener on the target machine
# - Ensure firewall allows port 28473 (default LeechCore port)
# - For best performance, use local FPGA connection
